name: Windows Kurumsal Portable (V1.7)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kaynak dosyalari al
        uses: actions/checkout@v4

      - name: Python kur (yalnizca GitHub derleme bilgisayarina)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Kutuphaneleri kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip check

      - name: Windows portable klasoru olustur
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CKS_Aski_Listesi --collect-all fitz --collect-all PIL --hidden-import win32print --hidden-import win32ui --hidden-import win32con cks_aski.py
          if (!(Test-Path 'dist/CKS_Aski_Listesi/CKS_Aski_Listesi.exe')) { throw 'EXE olusturulamadi' }

      - name: SHA-256 kontrol listesi olustur
        shell: pwsh
        run: |
          $app = (Resolve-Path 'dist/CKS_Aski_Listesi').Path
          $lines = Get-ChildItem $app -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($app.Length + 1).Replace('\','/')
            (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $relative
          }
          $lines | Set-Content -Path 'dist/CKS_Aski_Listesi_SHA256.txt' -Encoding utf8
          Get-FileHash 'dist/CKS_Aski_Listesi/CKS_Aski_Listesi.exe' -Algorithm SHA256 | Format-List

      - name: Windows Defender guvenlik taramasi
        shell: pwsh
        run: |
          $scan = Get-Command Start-MpScan -ErrorAction SilentlyContinue
          $threatCmd = Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue
          if (-not $scan -or -not $threatCmd) {
            Write-Warning 'Defender tarama komutlari bu runner uzerinde kullanilamiyor. Tarama YAPILMADI; guvenlik onayi anlamina gelmez.'
            exit 0
          }
          $target = (Resolve-Path 'dist/CKS_Aski_Listesi').Path
          try {
            Start-MpScan -ScanType CustomScan -ScanPath $target -ErrorAction Stop
          } catch {
            Write-Warning "Defender taramasi tamamlanamadi: $_. Guvenlik onayi olarak kullanmayin."
            exit 0
          }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            $_.Resources -and (($_.Resources -join ' ') -like "*$target*")
          })
          if ($detections.Count -gt 0) {
            $detections | Format-List | Out-String | Write-Output
            throw 'Defender olasi tehdit tespit etti. Artifact yuklenmedi.'
          }
          Write-Host 'Defender taramasi tamamlandi; hedef klasor icin raporlanan tespit yok. Bu garanti degildir.'

      - name: Portable klasoru indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: CKS_Aski_Listesi_V1_7_Portable_Klasor
          path: |
            dist/CKS_Aski_Listesi/**
            dist/CKS_Aski_Listesi_SHA256.txt
          if-no-files-found: error
          retention-days: 30
